[project]
name = "castle-agents"
version = "0.1.0"
description = "Parallel request runtime for a group-chat investing agent: ordered answers per chat, mid-flight edits"
requires-python = ">=3.11"
dependencies = [
    "anthropic[aiohttp]>=1.13,<2",
    "massive>=2.8,<3",
    "orjson>=3.10",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "uvloop>=0.21; sys_platform != 'win32'",
]

[project.scripts]
castle-agents = "castle_agents.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.1",
    "pyright>=1.1.400",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/castle_agents"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "castle_agents/_bundled_config"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en dashes and arrows in prose are intentional

[tool.importlinter]
root_package = "castle_agents"

[[tool.importlinter.contracts]]
name = "Layers: each layer imports only from layers below it"
type = "layers"
containers = ["castle_agents"]
layers = [
    "cli",
    "settings",
    "adapters | simulation | observability | evaluation",
    "runtime",
    "domain",
]
exhaustive = true
exhaustive_ignores = ["__main__"]

[[tool.importlinter.contracts]]
name = "Adapters are independent of each other"
type = "independence"
modules = [
    "castle_agents.adapters.claude",
    "castle_agents.adapters.mock",
    "castle_agents.adapters.massive",
]

[[tool.importlinter.contracts]]
name = "domain: internals are private; import from castle_agents.domain"
type = "protected"
protected_modules = ["castle_agents.domain.*"]
allowed_importers = ["castle_agents.domain"]

[[tool.importlinter.contracts]]
name = "runtime: internals are private; import from castle_agents.runtime"
type = "protected"
protected_modules = ["castle_agents.runtime.*"]
allowed_importers = ["castle_agents.runtime"]

[[tool.importlinter.contracts]]
name = "adapters.claude: internals are private; import from castle_agents.adapters.claude"
type = "protected"
protected_modules = ["castle_agents.adapters.claude.*"]
allowed_importers = ["castle_agents.adapters.claude"]

[[tool.importlinter.contracts]]
name = "adapters.mock: internals are private; import from castle_agents.adapters.mock"
type = "protected"
protected_modules = ["castle_agents.adapters.mock.*"]
allowed_importers = ["castle_agents.adapters.mock"]

[[tool.importlinter.contracts]]
name = "adapters.massive: internals are private; import from castle_agents.adapters.massive"
type = "protected"
protected_modules = ["castle_agents.adapters.massive.*"]
allowed_importers = ["castle_agents.adapters.massive"]

[[tool.importlinter.contracts]]
name = "observability: internals are private; import from castle_agents.observability"
type = "protected"
protected_modules = ["castle_agents.observability.*"]
allowed_importers = ["castle_agents.observability"]

[[tool.importlinter.contracts]]
name = "simulation: internals are private; import from castle_agents.simulation"
type = "protected"
protected_modules = ["castle_agents.simulation.*"]
allowed_importers = ["castle_agents.simulation"]

[[tool.importlinter.contracts]]
name = "settings: internals are private; import from castle_agents.settings"
type = "protected"
protected_modules = ["castle_agents.settings.*"]
allowed_importers = ["castle_agents.settings"]

[[tool.importlinter.contracts]]
name = "cli: internals are private; import from castle_agents.cli"
type = "protected"
protected_modules = ["castle_agents.cli.*"]
allowed_importers = ["castle_agents.cli"]

[[tool.importlinter.contracts]]
name = "evaluation: internals are private; import from castle_agents.evaluation"
type = "protected"
protected_modules = ["castle_agents.evaluation.*"]
allowed_importers = ["castle_agents.evaluation"]
